<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 Noon 会话监控器</title>
<style>
  body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #202124; background: #f6f8f5; }
  main { max-width: 720px; margin: 48px auto; padding: 0 28px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  ol { padding-left: 24px; }
  li { margin: 16px 0; }
  code { background: #e7ece5; padding: 3px 7px; border-radius: 4px; }
  .path { display: block; margin-top: 8px; word-break: break-all; }
</style>
<main>
  <h1>安装 Noon 会话监控器</h1>
  <ol>
    <li>按 <code>Ctrl+L</code>，输入 <code>chrome://extensions</code>，按 Enter。</li>
    <li>开启右上角“开发者模式”。</li>
    <li>点击“加载已解压的扩展”，选择旁边已打开的 <code>Noon登录助手扩展</code> 文件夹。</li>
    <li>确认扩展名称为 <code>Noon 会话监控器</code>，版本 <code>4.1.0</code>。</li>
  </ol>
  <p>每个店铺 Profile 都需要完成一次。安装后此说明页可以关闭。</p>
</main>
</html>
